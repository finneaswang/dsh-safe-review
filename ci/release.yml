name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Match tag to package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run check:publication
      - run: npm run verify
      - name: Build and validate release artifact
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          node scripts/check-publication.mjs --package dist/finneas-dsh-safe-review-0.3.2.tgz
          node scripts/product-smoke.mjs dist/finneas-dsh-safe-review-0.3.2.tgz
          node scripts/restart-smoke.mjs dist/finneas-dsh-safe-review-0.3.2.tgz
          cd dist
          shasum -a 256 *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS.txt --verify-tag --generate-notes --title "DSH Safe Review $GITHUB_REF_NAME"
